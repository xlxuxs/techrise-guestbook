services:
  proxy:
    image: nginx:alpine
    ports:
      - "${APP_PORT}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web

  web:
    build: .
    env_file:
      - .env
    depends_on:
      - redis
    # No ports published — only accessible via proxy

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    # No ports published — only accessible by web service

volumes:
  redis_data:
